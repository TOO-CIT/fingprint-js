name: JS · Publish npm

on:
  workflow_dispatch:
    inputs:
      agent:
        description: Base64-encoded agent.tgz
        required: true
        type: string
      react:
        description: Base64-encoded react.tgz
        required: true
        type: string
      vue:
        description: Base64-encoded vue.tgz
        required: true
        type: string
      source_run_id:
        description: Source release workflow run ID
        required: true
        type: string
      source_run_attempt:
        description: Source release workflow run attempt
        required: true
        type: string
      source_sha:
        description: Source release commit SHA
        required: true
        type: string
      sha256:
        description: Colon-separated SHA-256 digests for agent, react and vue
        required: true
        type: string

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      id-token: write
    steps:
      - name: Authorize publisher dispatch
        run: |
          set -euo pipefail
          # Account ID of fingprint-js-release[bot].
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch || "$GITHUB_REF" != refs/heads/main ||
                "$GITHUB_ACTOR_ID" != 361032127 || "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            echo "::error::Expected a new dispatch on main from the release GitHub App"
            exit 1
          fi

      - name: Resolve private handoff source
        id: source
        env:
          SOURCE_REPOSITORY: ${{ secrets.JS_SOURCE_REPOSITORY }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPOSITORY" =~ ^[a-zA-Z0-9-]+/[a-zA-Z0-9_.-]+$ ]]
          owner=${SOURCE_REPOSITORY%/*}
          repo=${SOURCE_REPOSITORY#*/}
          echo "::add-mask::$owner"
          echo "::add-mask::$repo"
          printf 'owner=%s\nrepo=%s\n' "$owner" "$repo" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@v3
        id: reader
        with:
          client-id: ${{ vars.JS_HANDOFF_APP_CLIENT_ID }}
          private-key: ${{ secrets.JS_HANDOFF_APP_PRIVATE_KEY }}
          owner: ${{ steps.source.outputs.owner }}
          repositories: ${{ steps.source.outputs.repo }}
          permission-actions: read

      - name: Authorize source workflow run
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
          SOURCE_REPOSITORY: ${{ secrets.JS_SOURCE_REPOSITORY }}
        run: |
          set -euo pipefail
          run_id=$(jq -er '.inputs.source_run_id | strings | select(test("^[1-9][0-9]*$"))' "$GITHUB_EVENT_PATH")
          attempt=$(jq -er '.inputs.source_run_attempt | strings | select(test("^[1-9][0-9]*$"))' "$GITHUB_EVENT_PATH")
          sha=$(jq -er '.inputs.source_sha | strings | select(test("^[0-9a-f]{40}$"))' "$GITHUB_EVENT_PATH")
          if ! gh api "repos/$SOURCE_REPOSITORY/actions/runs/$run_id/attempts/$attempt" |
            jq -e --arg repo "$SOURCE_REPOSITORY" --arg id "$run_id" --arg attempt "$attempt" --arg sha "$sha" '
              .path == ".github/workflows/release.yml" and .event == "push" and
              .head_branch == "main" and .head_repository.full_name == $repo and
              (.id | tostring) == $id and (.run_attempt | tostring) == $attempt and
              .head_sha == $sha
            ' > /dev/null; then
            echo "::error::Dispatch does not match the source release workflow run"
            exit 1
          fi

      - name: Restore npm handoff
        run: |
          set -euo pipefail
          mkdir -- "$RUNNER_TEMP/npm-handoff"
          cd -- "$RUNNER_TEMP/npm-handoff"
          for name in agent react vue; do
            if ! jq -er --arg name "$name" '.inputs[$name] | strings | select(length > 0)' "$GITHUB_EVENT_PATH" |
              base64 -d > "$name.tgz"; then
              echo "::error::Missing or invalid npm handoff archive: $name.tgz"
              exit 1
            fi
          done
          expected=$(jq -er '.inputs.sha256 | strings' "$GITHUB_EVENT_PATH")
          actual=$(sha256sum agent.tgz react.tgz vue.tgz | cut -d ' ' -f 1 | paste -sd : -)
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::npm handoff checksum mismatch"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'

      - name: Set up npm for Trusted Publishing
        run: npm install --global npm@11.21.3

      - name: Publish missing npm versions
        working-directory: ${{ runner.temp }}/npm-handoff
        env:
          NPM_CONFIG_PROVENANCE: 'false'
        run: |
          set -euo pipefail
          pending=()
          for name in agent react vue; do
            archive="$name.tgz"
            files=$(tar -tzf "$archive")
            if grep -E '\.map$' <<< "$files"; then
              echo "::error::Sourcemap found in $archive"
              exit 1
            fi
            version=$(tar -xzOf "$archive" package/package.json |
              jq -er --arg name "@fingerru/$name" '
                select(.name == $name and .publishConfig.access == "public" and
                  .repository.url == "git+https://github.com/TOO-CIT/fingprint-js.git") |
                .version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))
              ')
            status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
              "https://registry.npmjs.org/@fingerru%2f$name/$version")
            case "$status" in
              200) echo "Already published: @fingerru/$name@$version" ;;
              404) pending+=("$archive") ;;
              *) echo "::error::npm registry returned HTTP $status for @fingerru/$name@$version"; exit 1 ;;
            esac
          done
          for archive in "${pending[@]}"; do
            npm publish "./$archive" --registry=https://registry.npmjs.org --access public --tag latest --ignore-scripts
          done
